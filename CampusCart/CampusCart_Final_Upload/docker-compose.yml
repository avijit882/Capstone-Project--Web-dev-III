services:
  mongo:
    image: mongo:7.0
    container_name: campuscart-mongo
    command: ["mongod","--replSet","rs0","--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["campuscart_mongo_data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL","mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}).ok }' | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
volumes:
  campuscart_mongo_data:
